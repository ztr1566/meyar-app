services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: meyar_user
      POSTGRES_PASSWORD: meyar_password
      POSTGRES_DB: meyar_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meyar_user -d meyar_db"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
