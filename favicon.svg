<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <!-- Meyar Amber-Gold Gradient matching the luxury dark theme -->
    <linearGradient id="meyar-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF3D1"/>
      <stop offset="25%" stop-color="#F5C04E"/>
      <stop offset="65%" stop-color="#C5A059"/>
      <stop offset="100%" stop-color="#8C5E16"/>
    </linearGradient>
    <linearGradient id="meyar-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A2620"/>
      <stop offset="50%" stop-color="#0E1612"/>
      <stop offset="100%" stop-color="#050807"/>
    </linearGradient>
    <filter id="subtle-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#F5C04E" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Luxury Dark Squircle Surface -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#meyar-bg)" stroke="url(#meyar-gold)" stroke-width="1.75"/>
  <rect x="5" y="5" width="54" height="54" rx="13" fill="none" stroke="url(#meyar-gold)" stroke-width="0.75" opacity="0.25"/>

  <!-- ================= CHEF HAT SILHOUETTE (IMAGE INSPIRATION) ================= -->
  <g transform="translate(-1, 0)">
    <!-- Main Crown with 3 Undulating Domes and Signature Downward Hook -->
    <path d="M 21 44 
             C 14 36, 10 30, 10 22 
             C 10 13, 18 8, 27 8 
             C 31 8, 36 10, 39 13 
             C 44 6, 55 4, 63 8 
             C 70 11, 74 17, 74 22 
             C 74 27, 71 32, 69 31 
             C 67 30, 69 26, 68 22 
             C 66 15, 58 12, 50 14 
             C 44 16, 40 21, 36 22 
             C 32 23, 28 17, 24 17 
             C 19 17, 15 21, 16 26 
             C 17 32, 21 38, 26 43 Z" 
          fill="url(#meyar-gold)" filter="url(#subtle-glow)"/>

    <!-- Inner Dynamic Shadow Swoop -->
    <path d="M 24 29 
             C 24 29, 29 35, 37 39 
             C 32 41, 26 37, 25 33 Z" 
          fill="url(#meyar-gold)"/>

    <!-- Upper Brim Stroke -->
    <path d="M 25 45 C 31 45, 39 44, 43 43 C 41 45, 33 46, 25 46 Z" 
          fill="url(#meyar-gold)"/>

    <!-- Bottom Rounded Folded Band -->
    <path d="M 20 50 
             C 20 48, 52 48, 55 50 
             C 58 52, 57 56, 53 56 
             C 44 56, 23 56, 21 56 
             C 19 56, 20 52, 20 50 Z" 
          fill="url(#meyar-gold)"/>
  </g>
</svg>
